<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONNX Web Inference</title>
  <!-- ONNX Runtime Web CDN -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .controls { margin-bottom: 15px; display: flex; gap: 10px; }
    #canvas, #webcam { border: 1px solid #ccc; max-width: 300px; display: block; margin: 10px 0; }
    #webcam { display: none; }
    #output { font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>Browser Machine Learning</h2>

  <div class="controls">
    <input type="file" id="file-input" accept="image/*">
    <button id="camera-btn">Start Camera</button>
    <button id="capture-btn" style="display:none;">Snap & Predict</button>
  </div>

  <video id="webcam" autoplay playsinline></video>
  <canvas id="canvas" width="224" height="224"></canvas>
  
  <p id="output">Loading model...</p>

  <script>
    let session = null;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('file-input');
    const webcam = document.getElementById('webcam');
    const cameraBtn = document.getElementById('camera-btn');
    const captureBtn = document.getElementById('capture-btn');
    const output = document.getElementById('output');

    // 1. Initialize ONNX Session
    async function initModel() {
      try {
        // Point this to your model path in the repo
        session = await ort.InferenceSession.create('./best.onnx');
        output.innerText = "Model loaded! Upload an image or use the camera.";
      } catch (e) {
        output.innerText = "Failed to load model: " + e.message;
      }
    }
    initModel();

    // 2. Handle Image Upload
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        // Stop webcam stream if running
        stopWebcam();
        // Draw & scale uploaded image onto canvas
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        runInference();
      };
      img.src = URL.createObjectURL(file);
    });

    // 3. Handle Webcam Stream
    cameraBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        webcam.srcObject = stream;
        webcam.style.display = 'block';
        captureBtn.style.display = 'inline-block';
        cameraBtn.style.display = 'none';
      } catch (err) {
        alert("Camera access denied or not available.");
      }
    });

    captureBtn.addEventListener('click', () => {
      // Draw frame from webcam video onto the canvas
      ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);
      runInference();
    });

    function stopWebcam() {
      if (webcam.srcObject) {
        webcam.srcObject.getTracks().forEach(track => track.stop());
        webcam.style.display = 'none';
        captureBtn.style.display = 'none';
        cameraBtn.style.display = 'inline-block';
      }
    }

    // 4. Preprocess Image & Run Inference
    async function runInference() {
      if (!session) return;
      output.innerText = "Analyzing...";

      // Extract RGBA pixels from canvas
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const { data, width, height } = imageData;

      // Convert RGBA to NCHW Float32 array [1, 3, height, width] normalized to [0, 1]
      const float32Data = new Float32Array(3 * width * height);
      const channelSize = width * height;

      for (let i = 0; i < channelSize; i++) {
        float32Data[i] = data[i * 4] / 255.0;                   // R
        float32Data[channelSize + i] = data[i * 4 + 1] / 255.0; // G
        float32Data[channelSize * 2 + i] = data[i * 4 + 2] / 255.0; // B
      }

      // Create ONNX Tensor
      const inputTensor = new ort.Tensor('float32', float32Data, [1, 3, height, width]);

      // Note: Replace 'input' with your model's actual input node name
      const feeds = { input: inputTensor };

      try {
        const results = await session.run(feeds);
        // Get the first output tensor
        const outputKey = Object.keys(results)[0];
        const outputData = results[outputKey].data;

        // Example post-processing: find max output index (e.g. classification class)
        let maxIdx = 0;
        let maxVal = -Infinity;
        for (let i = 0; i < outputData.length; i++) {
          if (outputData[i] > maxVal) {
            maxVal = outputData[i];
            maxIdx = i;
          }
        }

        output.innerText = `Prediction: Class ${maxIdx} (Score: ${maxVal.toFixed(2)})`;
      } catch (err) {
        output.innerText = "Inference failed: " + err.message;
      }
    }
  </script>
</body>
</html>
